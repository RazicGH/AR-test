<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>AR Object Viewer</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.5/aframe/build/aframe-ar.js"></script>
    <script src="https://raw.githack.com/fcor/arjs-gestures/master/dist/gestures.js"></script>
    <style>
        body { margin: 0; overflow: hidden; }
        #ui {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 12px 25px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: bold;
            z-index: 100;
            pointer-events: none;
            border: 1px solid #00ffaa;
        }
        .a-canvas { width: 100% !important; height: 100% !important; top: 0 !important; left: 0 !important; }
    </style>
</head>
<body>
    <div id="ui">📱 1本指で回転 / 2本指でズーム</div>

    <a-scene embedded arjs="sourceType: webcam; videoTexture: true; debugUIEnabled: false;" vr-mode-ui="enabled: false;" gesture-detector>
        <a-marker preset="hiro">
            
            <a-entity
                id="gesture-container"
                gesture-handler
                position="0 0 0"
                scale="1 1 1">
                
                <a-sphere 
                    radius="0.2" 
                    material="color: #00ffaa; emissive: #00ffaa; emissiveIntensity: 0.3; roughness: 0.1;">
                </a-sphere>

                <a-torus-knot 
                    radius="0.25" 
                    radius-tubular="0.03" 
                    p="2" 
                    q="3"
                    material="color: #00aaff; metalness: 0.9; roughness: 0.1;">
                </a-torus-knot>

                <a-torus 
                    radius="0.4" 
                    radius-tubular="0.01" 
                    rotation="45 45 0"
                    material="color: #ffffff; opacity: 0.7;">
                </a-torus>

            </a-entity>

            <a-light type="ambient" color="#fff" intensity="0.6"></a-light>
            <a-light type="directional" color="#00ffaa" position="1 2 1" intensity="0.8"></a-light>
            <a-light type="directional" color="#00aaff" position="-1 2 -1" intensity="0.8"></a-light>
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>
</body>
</html>
