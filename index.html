<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>シンプルWebAR</title>

    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <style>
        /* 画面全体の余白をゼロに */
        body {
            margin: 0;
            overflow: hidden;
        }

        /* スマホでも崩れないレスポンシブUIコンテナ */
        .ui-container {
            position: fixed;
            bottom: 30px; /* 画面下部から30pxの位置に固定 */
            left: 50%;
            transform: translateX(-50%);
            width: 85%; /* スマホ画面の横幅85%にフィット */
            max-width: 350px; /* PCなどで見たとき大きくなりすぎない制限 */
            z-index: 9999; /* AR映像（背景）より必ず手前に表示 */
            display: flex;
            justify-content: center;
            pointer-events: none; /* UIの透明な隙間をタップした時はAR空間に干渉できるようにする */
        }

        /* タップしやすいボタンのデザイン */
        .ar-button {
            pointer-events: auto; /* ボタン自体はタップ可能にする */
            width: 100%;
            padding: 16px;
            font-size: 18px;
            font-weight: bold;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 30px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        /* ボタンを押したときの視覚効果 */
        .ar-button:active {
            background-color: #0056b3;
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="ui-container">
        <button class="ar-button" id="action-btn">キューブにアクション！</button>
    </div>

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
        
        <a-marker preset="hiro">
            <a-box 
                id="target-cube"
                position="0 0.5 0" 
                material="color: #ff4757; opacity: 0.9;"
                animation="property: rotation; to: 0 360 0; loop: true; dur: 4000; easing: linear">
            </a-box>
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>

    <script>
        // ボタンを押したときの処理（可読性を重視したシンプルな記述）
        const button = document.getElementById('action-btn');
        const cube = document.getElementById('target-cube');

        button.addEventListener('click', () => {
            // 例：ボタンを押すとキューブの色が緑に変わり、アラートが出る
            cube.setAttribute('material', 'color', '#2ed573');
            alert('キューブに触れました！');
        });
    </script>
</body>
</html>
