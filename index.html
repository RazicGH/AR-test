<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <!--
      重要: A-Frame と AR.js はバージョンを必ず一致させる。
      公式ドキュメント: AR.js 3.4.7 は A-Frame 1.6.0 を要求する。
      master は使わず、固定バージョン(3.4.7)を読み込む。
    -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>
    <script src="https://unpkg.com/aframe-animation-component@5.1.2/dist/aframe-animation-component.min.js"></script>

    <style>
      html, body { margin: 0; padding: 0; overflow: hidden; }
      #info {
        position: fixed;
        top: 10px;
        left: 10px;
        color: white;
        background: rgba(0,0,0,0.6);
        padding: 10px 15px;
        border-radius: 5px;
        font-family: Arial, sans-serif;
        font-size: 12px;
        z-index: 100;
        max-width: 200px;
      }
      #controls {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        color: white;
        background: rgba(0,0,0,0.7);
        padding: 15px 20px;
        border-radius: 10px;
        font-family: Arial, sans-serif;
        text-align: center;
        z-index: 100;
      }
      button {
        background: #00aaff;
        color: white;
        border: none;
        padding: 10px 15px;
        margin: 5px;
        border-radius: 5px;
        cursor: pointer;
        font-weight: bold;
        font-size: 14px;
      }
      button:active { background: #0088cc; }
    </style>
  </head>
  <body>
    <div id="info">
      <div>スマホでの操作:</div>
      <div>・ドラッグ: 立方体回転</div>
      <div>・ボタン: 自動回転</div>
      <div>・ピンチ: サイズ変更</div>
    </div>

    <div id="controls">
      <div style="margin-bottom: 10px;">立方体を操作してください</div>
      <button onclick="toggleAutoRotate()">自動回転 ON/OFF</button>
      <button onclick="resetObject()">リセット</button>
    </div>

    <!--
      修正点:
      - vr-mode-ui を無効化(VRボタンの誤表示防止)
      - renderer に logarithmicDepthBuffer を指定(深度精度の安定化)
      - arjs に sourceWidth/Height・displayWidth/Height を明示し、
        Android のカメラ解像度差で描画スケールが狂うのを防ぐ
      - 手動の <a-entity camera> は削除。marker 方式では a-scene が
        正しいカメラを自動生成するため、二重カメラはズレの原因になる。
    -->
    <a-scene
      vr-mode-ui="enabled: false"
      renderer="logarithmicDepthBuffer: true; antialias: true; alpha: true"
      embedded
      arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3; sourceWidth: 1280; sourceHeight: 960; displayWidth: 1280; displayHeight: 960;">

      <a-marker preset="hiro" smooth="true" smoothCount="5" smoothTolerance="0.01" smoothThreshold="2">
        <!-- 立方体: マーカー面のすぐ上に乗せる(高さ=幅の半分=0.5) -->
        <a-box
          id="interactive-cube"
          position="0 0 0"
          width="1" height="1" depth="1"
          material="color: #00aaff; wireframe: false;">
        </a-box>

        <!-- マーカー中心の視覚化 -->
        <a-sphere
          position="0 0 0"
          radius="0.1"
          material="color: #ff6600; opacity: 0.5;">
        </a-sphere>
      </a-marker>

      <!-- marker 方式の標準カメラ。手動 camera entity は置かない。 -->
      <a-entity camera></a-entity>
    </a-scene>

    <script>
      const cube = document.getElementById('interactive-cube');
      let cubeRotation = { x: 0, y: 0, z: 0 };
      let autoRotate = false;
      let autoRotateInterval = null;
      let lastTouchX = 0, lastTouchY = 0;
      let lastDistance = 0;
      let cubeScale = 1;

      // UI(info/controls)上のタッチは操作対象外にする
      function isOnUI(target) {
        return target.closest && (target.closest('#controls') || target.closest('#info'));
      }

      // ====== タッチドラッグで回転 / ピンチで拡縮 ======
      document.addEventListener('touchstart', (e) => {
        if (isOnUI(e.target)) return;
        if (e.touches.length === 1) {
          lastTouchX = e.touches[0].clientX;
          lastTouchY = e.touches[0].clientY;
        } else if (e.touches.length === 2) {
          const dx = e.touches[0].clientX - e.touches[1].clientX;
          const dy = e.touches[0].clientY - e.touches[1].clientY;
          lastDistance = Math.sqrt(dx * dx + dy * dy);
        }
      }, { passive: false });

      document.addEventListener('touchmove', (e) => {
        if (isOnUI(e.target)) return;
        if (e.touches.length === 1) {
          const currentX = e.touches[0].clientX;
          const currentY = e.touches[0].clientY;
          cubeRotation.y += (currentX - lastTouchX);
          cubeRotation.x += (currentY - lastTouchY);
          updateCubeRotation();
          lastTouchX = currentX;
          lastTouchY = currentY;
          stopAutoRotate();
        } else if (e.touches.length === 2) {
          const dx = e.touches[0].clientX - e.touches[1].clientX;
          const dy = e.touches[0].clientY - e.touches[1].clientY;
          const currentDistance = Math.sqrt(dx * dx + dy * dy);
          if (lastDistance > 0) {
            cubeScale *= currentDistance / lastDistance;
            cubeScale = Math.max(0.5, Math.min(2.5, cubeScale));
            cube.setAttribute('scale', `${cubeScale} ${cubeScale} ${cubeScale}`);
          }
          lastDistance = currentDistance;
        }
        e.preventDefault(); // ピンチでのページズームを抑止
      }, { passive: false });

      // ====== マウス(デスクトップ確認用) ======
      let isMouseDown = false;
      document.addEventListener('mousedown', (e) => {
        if (isOnUI(e.target)) return;
        isMouseDown = true;
        lastTouchX = e.clientX;
        lastTouchY = e.clientY;
      });
      document.addEventListener('mousemove', (e) => {
        if (!isMouseDown) return;
        cubeRotation.y += (e.clientX - lastTouchX);
        cubeRotation.x += (e.clientY - lastTouchY);
        updateCubeRotation();
        lastTouchX = e.clientX;
        lastTouchY = e.clientY;
        stopAutoRotate();
      });
      document.addEventListener('mouseup', () => { isMouseDown = false; });

      // ====== 回転更新 ======
      function updateCubeRotation() {
        cube.setAttribute('rotation',
          `${cubeRotation.x} ${cubeRotation.y} ${cubeRotation.z}`);
      }

      // ====== 自動回転 ======
      function toggleAutoRotate() {
        autoRotate = !autoRotate;
        if (autoRotate) {
          autoRotateInterval = setInterval(() => {
            cubeRotation.y += 2;
            updateCubeRotation();
          }, 30);
        } else {
          stopAutoRotate();
        }
      }
      function stopAutoRotate() {
        autoRotate = false;
        if (autoRotateInterval) { clearInterval(autoRotateInterval); autoRotateInterval = null; }
      }

      // ====== リセット ======
      function resetObject() {
        cubeRotation = { x: 0, y: 0, z: 0 };
        cubeScale = 1;
        stopAutoRotate();
        updateCubeRotation();
        cube.setAttribute('scale', '1 1 1');
      }

      updateCubeRotation();
    </script>
  </body>
</html>
